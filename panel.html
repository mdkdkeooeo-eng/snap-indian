<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    .panel-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #FFFC00;
      text-align: center;
    }
    .section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ccc;
      font-weight: 500;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 14px;
      background: #2a2a2a;
      color: #fff;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #FFFC00;
    }
    .help-text {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .checkbox-group {
      margin-top: 12px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
      color: #ccc;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 10px;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #FFFC00;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #000;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #FFE500;
    }
    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status.running {
      background: rgba(33, 150, 243, 0.2);
      color: #64b5f6;
      border: 1px solid #2196F3;
    }
    .status.stopped {
      background: rgba(100, 100, 100, 0.2);
      color: #aaa;
      border: 1px solid #666;
    }
    .status.error {
      background: rgba(198, 40, 40, 0.2);
      color: #ef5350;
      border: 1px solid #c62828;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #444;
      color: #fff;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <button class="close-btn" id="closeBtn" title="Close Panel">×</button>
  <div class="panel-container">
    <h1>Snapchat Friend Filter</h1>
    
    <div class="section">
      <label for="minDelay">Min Delay (ms)</label>
      <input type="number" id="minDelay" value="800" min="100" step="100">
      <div class="help-text">Minimum delay between actions</div>
    </div>
    
    <div class="section">
      <label for="maxDelay">Max Delay (ms)</label>
      <input type="number" id="maxDelay" value="2000" min="500" step="100">
      <div class="help-text">Maximum delay between actions</div>
    </div>
    
    <div class="section">
      <label for="scrollDelay">Scroll Delay (ms)</label>
      <input type="number" id="scrollDelay" value="1500" min="500" step="100">
      <div class="help-text">Delay after scrolling</div>
    </div>
    
    <div class="section">
      <label for="maxScrolls">Max Scrolls</label>
      <input type="number" id="maxScrolls" value="50" min="1" step="5">
      <div class="help-text">Maximum scroll operations</div>
    </div>
    
    <div class="section checkbox-group">
      <label>
        <input type="checkbox" id="filterNonAmerican" checked>
        Filter non-American names
      </label>
      <label>
        <input type="checkbox" id="filterBrownEmoji" checked>
        Filter brown emoji profiles
      </label>
      <label>
        <input type="checkbox" id="humanLikeMouse" checked>
        Human-like mouse movements
      </label>
    </div>
    
    <button id="startBtn">Start Filtering</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="debugBtn" style="background: #666; color: white;">Debug Buttons</button>
    <button id="findBtn" style="background: #2196F3; color: white;">Find All Buttons (Log)</button>
    
    <div id="status" class="status stopped">Ready</div>
  </div>
  
  <script src="panel.js"></script>
</body>
</html>
