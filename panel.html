<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      font-size: 13px;
    }
    .panel {
      padding: 15px;
      height: 100vh;
      overflow-y: auto;
    }
    h1 {
      font-size: 18px;
      color: #FFFC00;
      text-align: center;
      margin-bottom: 15px;
    }
    h2 {
      font-size: 14px;
      color: #FFFC00;
      margin: 15px 0 10px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .field {
      flex: 1;
    }
    label {
      display: block;
      color: #aaa;
      font-size: 11px;
      margin-bottom: 3px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      color: #fff;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #FFFC00;
    }
    .checkbox {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .checkbox input {
      margin-right: 8px;
      width: 16px;
      height: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-start { background: #FFFC00; color: #000; }
    .btn-start:hover { background: #FFE500; }
    .btn-start:disabled { background: #444; color: #888; cursor: not-allowed; }
    .btn-stop { background: #f44336; color: #fff; }
    .btn-stop:disabled { background: #444; color: #888; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-secondary:hover { background: #444; }
    .btn-small { padding: 8px; font-size: 12px; }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-size: 12px;
    }
    .status.running { background: rgba(33,150,243,0.2); color: #64b5f6; border: 1px solid #2196F3; }
    .status.stopped { background: rgba(100,100,100,0.2); color: #aaa; border: 1px solid #666; }
    .status.error { background: rgba(244,67,54,0.2); color: #ef5350; border: 1px solid #f44336; }
    .stats {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #FFFC00;
    }
    .stat-label {
      font-size: 10px;
      color: #888;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #444;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }
    .close-btn:hover { background: #666; }
    .help {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <button class="close-btn" id="closeBtn">×</button>
  <div class="panel">
    <h1>Snapchat Friend Filter</h1>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="statSession">0</div>
        <div class="stat-label">Session</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statHour">0</div>
        <div class="stat-label">Hour</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statToday">0</div>
        <div class="stat-label">Today</div>
      </div>
    </div>
    
    <h2>Rate Limits</h2>
    <div class="row">
      <div class="field">
        <label>Max Daily</label>
        <input type="number" id="maxDaily" value="100" min="0" step="10">
        <div class="help">0 = unlimited</div>
      </div>
      <div class="field">
        <label>Max Hourly</label>
        <input type="number" id="maxHourly" value="20" min="0" step="5">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Max Per Session</label>
        <input type="number" id="maxSession" value="30" min="0" step="5">
      </div>
      <div class="field">
        <label>Session Break (mins)</label>
        <input type="number" id="sessionBreakMins" value="30" min="0" step="5">
        <div class="help">Wait time between sessions</div>
      </div>
    </div>
    
    <h2>Delays (ms)</h2>
    <div class="row">
      <div class="field">
        <label>Min Delay</label>
        <input type="number" id="minDelay" value="1000" min="500" step="100">
      </div>
      <div class="field">
        <label>Max Delay</label>
        <input type="number" id="maxDelay" value="3000" min="1000" step="100">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Scroll Delay</label>
        <input type="number" id="scrollDelay" value="1500" min="500" step="100">
      </div>
      <div class="field">
        <label>Max Scrolls</label>
        <input type="number" id="maxScrolls" value="50" min="1" step="5">
      </div>
    </div>
    
    <h2>Filters</h2>
    <label class="checkbox">
      <input type="checkbox" id="filterNonAmerican" checked>
      Decline non-American names
    </label>
    <label class="checkbox">
      <input type="checkbox" id="filterBrownEmoji" checked>
      Decline brown emoji profiles
    </label>
    <label class="checkbox">
      <input type="checkbox" id="humanLikeMouse" checked>
      Human-like behavior
    </label>
    
    <button class="btn-start" id="startBtn">▶ Start Filtering</button>
    <button class="btn-stop" id="stopBtn" disabled>■ Stop</button>
    
    <div class="row" style="margin-top: 10px;">
      <button class="btn-secondary btn-small" id="debugBtn" style="flex:1;">Debug</button>
      <button class="btn-secondary btn-small" id="findBtn" style="flex:1;">Find Buttons</button>
      <button class="btn-secondary btn-small" id="resetBtn" style="flex:1;">Reset Limits</button>
    </div>
    
    <div id="status" class="status stopped">Ready</div>
  </div>
  
  <script src="panel.js"></script>
</body>
</html>
