<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      font-size: 13px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 15px 0;
      color: #333;
    }
    .info {
      background: #4CAF50;
      color: white;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      text-align: center;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #FFFC00;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #000;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #FFE500; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #666; color: white; }
    .btn-secondary:hover { background: #555; }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    .status.running { background: #e3f2fd; color: #1976d2; }
    .status.stopped { background: #f5f5f5; color: #666; }
    .status.error { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <h1>Snapchat Friend Filter</h1>
  
  <div class="info">
    Click "Open Panel" to control the bot on the Snapchat page
  </div>
  
  <button id="openPanelBtn">Open Panel on Page</button>
  <button id="startBtn">Quick Start</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="findBtn" class="btn-secondary">Find All Buttons</button>
  
  <div id="status" class="status stopped">Ready</div>
  
  <script src="popup.js"></script>
</body>
</html>
