<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 20px 0;
      color: #333;
    }
    .section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .help-text {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .checkbox-group {
      margin-top: 12px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #FFFC00;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #000;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #FFE500;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }
    .status.running {
      background: #e3f2fd;
      color: #1976d2;
    }
    .status.stopped {
      background: #f5f5f5;
      color: #666;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
    }
  </style>
</head>
<body>
  <h1>Snapchat Friend Filter</h1>
  
  <div class="section">
    <label for="minDelay">Min Delay (ms)</label>
    <input type="number" id="minDelay" value="800" min="100" step="100">
    <div class="help-text">Minimum delay between actions (milliseconds)</div>
  </div>
  
  <div class="section">
    <label for="maxDelay">Max Delay (ms)</label>
    <input type="number" id="maxDelay" value="2000" min="500" step="100">
    <div class="help-text">Maximum delay between actions (milliseconds)</div>
  </div>
  
  <div class="section">
    <label for="scrollDelay">Scroll Delay (ms)</label>
    <input type="number" id="scrollDelay" value="1500" min="500" step="100">
    <div class="help-text">Delay after scrolling to load more items</div>
  </div>
  
  <div class="section">
    <label for="maxScrolls">Max Scrolls</label>
    <input type="number" id="maxScrolls" value="50" min="1" step="5">
    <div class="help-text">Maximum number of scroll operations</div>
  </div>
  
  <div class="section checkbox-group">
    <label>
      <input type="checkbox" id="filterNonAmerican" checked>
      Filter non-American names
    </label>
    <label>
      <input type="checkbox" id="filterBrownEmoji" checked>
      Filter brown emoji profiles
    </label>
    <label>
      <input type="checkbox" id="humanLikeMouse" checked>
      Human-like mouse movements
    </label>
  </div>
  
  <div style="background: #4CAF50; color: white; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-weight: bold;">
    Click extension icon to open panel on page!
  </div>
  
  <button id="openPanelBtn" style="background: #4CAF50; color: white; margin-bottom: 10px;">Open Panel Now</button>
  <button id="startBtn">Start Filtering</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="debugBtn" style="margin-top: 10px; background: #666; color: white;">Debug Buttons</button>
  <button id="findBtn" style="margin-top: 10px; background: #2196F3; color: white;">Find All Buttons (Log)</button>
  
  <div id="status" class="status stopped">Ready</div>
  
  <script src="popup.js"></script>
</body>
</html>
